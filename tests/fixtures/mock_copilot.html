<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mock Copilot</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    .chip { display: inline-block; background: #eee; margin: 2px; padding: 2px 6px; border-radius: 4px; }
    textarea { width: 100%; }
  </style>
</head>
<body>
  <!-- Stand-in for copilot.cloud.microsoft. It uses the same selectors as selectors.py,
       which is what the browser tests exercise. It is not a copy of the real page. -->
  <button aria-label="New chat" id="new">New chat</button>
  <div id="log"></div>
  <div id="composer">
    <span id="chips"></span>
    <button aria-label="Add and manage sources" data-testid="PlusMenuButton" id="attach">+</button>
    <span role="textbox" contenteditable="true" aria-label="Message Copilot" id="input"
          style="display:block; min-height:24px; border:1px solid #ccc; white-space:pre-wrap"></span>
    <button aria-label="Send" id="send">Send</button>
  </div>
  <script>
    const STORE = "mockThreads";
    const $ = (id) => document.getElementById(id);
    let pendingFiles = [];

    const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const threads = () => JSON.parse(localStorage.getItem(STORE) || "{}");
    const saveThreads = (t) => localStorage.setItem(STORE, JSON.stringify(t));
    const currentId = () => (location.hash.match(/#\/chat\/(\w+)/) || [])[1] || null;

    function render() {
      const id = currentId();
      $("log").innerHTML = "";
      if (!id) return;
      for (const m of threads()[id] || []) {
        const div = document.createElement("div");
        if (m.role === "user") div.setAttribute("data-content", "user-message");
        else div.setAttribute("data-testid", "copilot-message-reply-div");
        div.innerHTML = m.html;
        $("log").appendChild(div);
      }
    }

    function renderChips() {
      $("chips").innerHTML = pendingFiles.map((n) => `<span class="chip">${escapeHtml(n)}</span>`).join("");
    }

    // New chat only clears the URL. The thread id appears on the first send, as in the real page.
    $("new").addEventListener("click", () => {
      location.hash = "";
      render();
    });

    $("attach").addEventListener("click", () => {
      if (document.querySelector('input[type="file"]')) return;
      const input = document.createElement("input");
      input.type = "file";
      input.multiple = true;
      input.style.display = "none";
      input.addEventListener("change", () => {
        pendingFiles = [...input.files].map((f) => f.name);
        renderChips();
      });
      document.body.appendChild(input);
    });

    let busy = false;  // hashchange must not re-render the reply that is streaming

    // Like Copilot: Enter sends, Shift+Enter inserts a line break.
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        $("send").click();
      }
    });

    $("send").addEventListener("click", async () => {
      const text = $("input").innerText;
      if (!text.trim()) return;
      busy = true;
      if (!currentId()) location.hash = "#/chat/" + Math.random().toString(36).slice(2, 10);
      const id = currentId();

      const files = pendingFiles;
      pendingFiles = [];
      renderChips();

      const t = threads();
      t[id] = t[id] || [];
      t[id].push({ role: "user", html: escapeHtml(text) });
      saveThreads(t);
      render();
      $("input").innerText = "";

      // The reply reports which turn of this thread it is, so a test can tell whether
      // the thread was reused. It also reports the attachment names it received.
      const userTurns = t[id].filter((m) => m.role === "user").length;
      const names = files.length ? files.join(", ") : "none";
      const lastLine = text.trim().split("\n").pop();
      const full = `turn ${userTurns}: ACK; last line: ${lastLine}; attachments: ${names}`;

      const stop = document.createElement("button");
      stop.setAttribute("aria-label", "Stop generating");
      stop.textContent = "Stop";
      $("composer").appendChild(stop);

      const wrap = document.createElement("div");
      wrap.setAttribute("data-testid", "copilot-message-reply-div");
      const p = document.createElement("p");
      wrap.appendChild(p);
      $("log").appendChild(wrap);

      const step = Math.ceil(full.length / 3);
      for (let i = 1; i <= 3; i++) {
        await new Promise((r) => setTimeout(r, 150));
        p.textContent = full.slice(0, i * step);
      }
      p.textContent = full;
      if (text.includes("CODE")) {
        wrap.insertAdjacentHTML("beforeend", '<pre><code class="language-python">print(1)\n</code></pre>');
      }
      stop.remove();

      const saved = threads();
      saved[id].push({ role: "assistant", html: wrap.innerHTML });
      saveThreads(saved);
      busy = false;
    });

    window.addEventListener("hashchange", () => { if (!busy) render(); });
    render();
  </script>
</body>
</html>
