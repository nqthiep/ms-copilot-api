[project]
name = "copilot-gateway"
version = "0.1.0"
description = "Local OpenAI-compatible gateway that drives Microsoft 365 Copilot Web through Playwright"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "playwright>=1.44",
    "python-dotenv>=1.0",
    "websockets>=14",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "openai>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["copilot_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
